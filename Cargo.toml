num-rational = { version = "0.4.2", features = ["serde"] }
num-traits = "0.2.19"
num-complex = { version = "0.4.6", features = ["serde"] }
logos = "0.16.1"
thiserror = "2.0.18"
inventory = "0.3.24"
once_cell = "1.21.4"
fluent = "0.17.0"
